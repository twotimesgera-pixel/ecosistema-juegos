<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEOTL: Crónicas del Quinto Sol - v0.1</title>
<style>
:root { --bg:#100d18; --panel:#1a1526; --line:#332a4a; --jade:#3ddc97; --gold:#e8c46a; --red:#e05a6d; --txt:#e9e4f2; --mut:#9b8fb3; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--txt); font-family:Georgia,'Times New Roman',serif; padding:16px; }
header { text-align:center; margin-bottom:14px; }
h1 { color:var(--gold); letter-spacing:6px; font-size:26px; text-shadow:0 0 14px rgba(232,196,106,.25); }
.sub { color:var(--mut); font-size:13px; font-style:italic; }
#layout { display:flex; gap:14px; max-width:1100px; margin:0 auto; flex-wrap:wrap; align-items:flex-start; }
.col { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
#left { flex:1 1 270px; } #mid { flex:1.3 1 320px; } #right { flex:1 1 280px; }
h3 { color:var(--jade); font-size:13px; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px; font-family:'Courier New',monospace; }
h3 .cnt { color:var(--mut); float:right; }
.res { display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px dashed var(--line); font-size:15px; align-items:baseline; }
.res b { color:var(--gold); font-family:'Courier New',monospace; }
.res small { color:var(--mut); font-size:11px; margin-left:6px; }
button { background:#241b38; color:var(--txt); border:1px solid var(--line); border-radius:6px; padding:10px 12px; cursor:pointer; font-family:'Courier New',monospace; font-size:13px; width:100%; margin-top:8px; text-align:left; }
button:hover:not(:disabled) { border-color:var(--jade); color:var(--jade); }
button:disabled { opacity:.35; cursor:not-allowed; }
button .c { color:var(--gold); }
.bld .nm { font-weight:bold; }
.bld .ds { color:var(--mut); font-size:12px; display:block; margin:2px 0 4px; }
#pray { background:var(--jade); color:#0c2418; font-weight:bold; text-align:center; font-size:15px; letter-spacing:2px; border:0; padding:14px; width:100%; }
#pray:hover { filter:brightness(1.12); color:#0c2418; }
#eraBarWrap { background:#0c0a14; border:1px solid var(--line); border-radius:6px; height:22px; margin:8px 0 4px; overflow:hidden; }
#eraBar { background:linear-gradient(90deg,#e8c46a,#e05a6d); height:100%; width:0%; transition:width .3s; }
#eraTxt { font-size:12px; color:var(--mut); margin-bottom:6px; }
#fallBtn { background:#2b1420; border-color:var(--red); color:var(--red); font-weight:bold; }
#fallBtn:hover:not(:disabled) { border-color:var(--red); color:var(--red); filter:brightness(1.3); }
.rit { border-left:3px solid var(--jade); padding:8px 10px; background:#150f22; border-radius:4px; margin-bottom:8px; }
.rit.risk { border-left-color:var(--red); }
.rit .nm { color:var(--gold); font-size:14px; }
.rit .ds { color:var(--mut); font-size:12px; display:block; margin:2px 0 6px; line-height:1.4; }
.rit button { padding:6px 10px; font-size:12px; width:auto; margin:0; }
.codex { max-height:460px; overflow-y:auto; }
.ent { border-bottom:1px solid var(--line); padding:8px 2px; }
.ent .nm { color:var(--jade); font-size:14px; }
.ent .tx { color:var(--mut); font-size:12.5px; line-height:1.45; display:block; margin-top:3px; }
.locked { opacity:.35; }
#toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#241b38; border:1px solid var(--jade); color:var(--txt); padding:10px 18px; border-radius:8px; font-size:13px; display:none; max-width:90%; z-index:5; }
#fall { position:fixed; inset:0; background:rgba(8,6,14,.95); display:none; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:20px; z-index:10; }
#fall h2 { color:var(--gold); font-size:24px; letter-spacing:3px; margin-bottom:12px; }
#fall p { color:var(--mut); max-width:440px; line-height:1.55; margin-bottom:6px; }
#fall button { width:auto; padding:10px 30px; background:var(--gold); color:#241a06; border:0; font-weight:bold; letter-spacing:1px; }
.fly { position:fixed; color:var(--gold); font-family:'Courier New',monospace; font-size:14px; pointer-events:none; animation:fly 1s ease-out forwards; z-index:4; }
@keyframes fly { to { transform:translateY(-46px); opacity:0; } }
#hint { text-align:center; color:#665577; font-size:11px; margin-top:12px; font-family:'Courier New',monospace; }
@media (max-width:760px){ h1{font-size:19px; letter-spacing:3px} }
</style>
</head>
<body>
<header>
  <h1>TEOTL</h1>
  <p class="sub">Crónicas del Quinto Sol — prototipo v0.1</p>
</header>
<div id="layout">
  <div class="col" id="left">
    <h3>Panteón <span class="cnt" id="leyendaTxt"></span></h3>
    <div class="res"><span>Fe <small id="feRate"></small></span><b id="fe">0</b></div>
    <div class="res"><span>Maíz <small id="maizRate"></small></span><b id="maiz">0</b></div>
    <div class="res"><span>Conocimiento <small id="conocRate"></small></span><b id="conoc">0</b></div>
    <div class="res"><span>Teotle <small id="teotleRate"></small></span><b id="teotle">0</b></div>
    <button id="pray">ORAR (+2 fe)</button>
    <h3 style="margin-top:16px">Construcciones</h3>
    <div id="builds"></div>
  </div>
  <div class="col" id="mid">
    <h3>La era del Quinto Sol</h3>
    <div id="eraBarWrap"><div id="eraBar"></div></div>
    <div id="eraTxt"></div>
    <button id="fallBtn" disabled>◐ CERRAR LA ERA — que caiga el sol</button>
    <h3 style="margin-top:16px">Rituales</h3>
    <div id="rituals"></div>
  </div>
  <div class="col" id="right">
    <h3>Codex <span class="cnt" id="codexCnt"></span></h3>
    <div class="codex" id="codex"></div>
  </div>
</div>
<p id="hint">TEOTL v0.1 — avanza mientras no juegas (60% de producción, máx 8h). Guarda solo. Hecho por Super para z3rdgerald.</p>
<div id="toast"></div>
<div id="fall">
  <h2>EL QUINTO SOL SE APAGA</h2>
  <p id="fallTxt"></p>
  <button id="fallGo">ALZARSE COMO LEYENDA</button>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);

// ---------- estado ----------
const ERA_GOAL = 25; // teotle acumulado para cerrar la era
let S = null;
function newRun(keep) {
  return Object.assign({
    fe: 0, maiz: 0, conoc: 0, teotle: 0,
    totalFe: 0, totalTeotle: 0,
    altars: 0, milpas: 0, casas: 0, templos: 0,
    feMult: 1, maizMult: 1, conocMult: 1, teotleMult: 1,
    rituals: [], codex: ['quinto_sol'], leyenda: 0, eras: 0,
    clicks: 0, lastSeen: Date.now(), born: Date.now()
  }, keep || {});
}
S = newRun();
try {
  const raw = localStorage.getItem('teotl_save');
  if (raw) S = Object.assign(newRun(), JSON.parse(raw));
} catch(e) {}

// ---------- construccion: costos ----------
const BUILDS = [
  { k:'altars', nm:'Altar de piedra', ds:'Los fieles dejan ofrendas. Produce fe.', base:20, gr:1.15, out:'fe', amt:.8 },
  { k:'milpas', nm:'Milpa', ds:'La parcela sagrada de maíz. Produce maíz.', base:60, gr:1.15, out:'maiz', amt:1.2 },
  { k:'casas', nm:'Casa del conocimiento', ds:'Tlamatinime escriben la memoria. Produce conocimiento.', base:{maiz:40, fe:120}, gr:1.18, out:'conoc', amt:.4 },
  { k:'templos', nm:'Templo del sol', ds:'La escalera hacia Tonatiuh. Produce teotle.', base:{maiz:400, conoc:300}, gr:1.22, out:'teotle', amt:.05 }
];
function bcost(b) {
  const n = S[b.k];
  if (typeof b.base === 'number') return { fe: Math.ceil(b.base * Math.pow(b.gr, n)) };
  const c = {};
  for (const k in b.base) c[k] = Math.ceil(b.base[k] * Math.pow(b.gr, n));
  return c;
}
function canPay(c) { return (c.fe||0) <= S.fe && (c.maiz||0) <= S.maiz && (c.conoc||0) <= S.conoc && (c.teotle||0) <= S.teotle; }
function pay(c) { S.fe -= c.fe||0; S.maiz -= c.maiz||0; S.conoc -= c.conoc||0; S.teotle -= c.teotle||0; }
function costStr(c) { const p = []; if(c.fe)p.push('fe '+fmt(c.fe)); if(c.maiz)p.push('maíz '+fmt(c.maiz)); if(c.conoc)p.push('conoc '+fmt(c.conoc)); return p.join(' · '); }

// ---------- produccion ----------
function rates() {
  const ley = 1 + S.leyenda * .15;
  return {
    fe: S.altars * .8 * S.feMult * ley,
    maiz: S.milpas * 1.2 * S.maizMult * ley,
    conoc: S.casas * .4 * S.conocMult * ley,
    teotle: S.templos * .05 * S.teotleMult * ley
  };
}

// ---------- rituales ----------
const RITS = [
  { id:'lluvia', nm:'Ritual de lluvia', ds:'Ofrendas a Tláloc. Costo: 300 maíz. Efecto permanente: +25% producción de maíz.', risk:false,
    ok:()=> S.milpas >= 3, cost:()=>({maiz:300}),
    run(){ S.maizMult += .25; toast('Tláloc escucha. La lluvia cae sobre tus milpas. (+25% maíz)'); } },
  { id:'fuego', nm:'Fuego nuevo', ds:'Enciende el fuego que renueva el mundo. Costo: 600 fe. Efecto permanente: +25% producción de fe.', risk:false,
    ok:()=> S.altars >= 6, cost:()=>({fe:600}),
    run(){ S.feMult += .25; toast('El fuego nuevo arde en la cima. Los fieles oran con más fervor. (+25% fe)'); } },
  { id:'codices', nm:'Escribir códices', ds:'Memoria escrita para las eras futuras. Costo: 150 conocimiento. Efecto: +50% conocimiento y desbloquea saber antiguo.', risk:false,
    ok:()=> S.casas >= 2, cost:()=>({conoc:150}),
    run(){ S.conocMult += .5; toast('Los tlamatinime escriben. Lo que se recuerda, no muere. (+50% conocimiento)'); } },
  { id:'mictlan', nm:'Descenso a Mictlán', ds:'Tu dios baja al noveno piso a negociar con los muertos. Costo: 10 teotle. Efecto permanente: +50% producción de teotle.', risk:false,
    ok:()=> S.templos >= 1, cost:()=>({teotle:10}),
    run(){ S.teotleMult += .5; toast('Regresas de Mictlán con esencia de los muertos. (+50% teotle)'); } },
  { id:'gladiatorio', nm:'Sacrificio gladiatorio', risk:true,
    ds:'Gladiadores luchan por la vida en el templo. Costo: 800 fe. Apuesta: 60% de ganarse el favor divino (+50% fe), 40% de provocar la ira (-10% toda producción).',
    ok:()=> S.totalTeotle >= 3, cost:()=>({fe:800}),
    run(){ if (Math.random() < .6) { S.feMult += .5; toast('La multitud ruge. Los diosos sonríen. (+50% fe)'); }
      else { S.feMult *= .9; S.maizMult *= .9; S.conocMult *= .9; S.teotleMult *= .9; toast('La sangre manchó el altar. Los dioses apartan la mirada. (-10% producción)'); } } }
];

// ---------- codex ----------
const CODEX = [
  { id:'quinto_sol', nm:'El Quinto Sol', tx:'Cinco soles han existido. Cuatro cayeron: el del agua devoró a los hombres en peces, el del viento en monos, el de la lluvia de fuego en perros, y el tercero en guajolotes. Este es el Quinto Sol, el del movimiento, y también está condenado. La pregunta no es si caerá, sino quién será recordado cuando caiga.', when:()=> true },
  { id:'nanahuatzin', nm:'Nanahuatzin, el dios humilde', tx:'En Teotihuacán, dos dioses debían arrojarse al fuego para crear el nuevo sol. El espléndido Tecciztecatl dudó cuatro veces. Nanahuatzin, el dios de las bubas, cerró los ojos y saltó. El humilde se volvió sol; el orgulloso se volvió luna. Tu fe nació de esa hoguera.', when:()=> S.totalFe >= 10 },
  { id:'tonatiuh', nm:'Tonatiuh, el sol que exige', tx:'Tonatiuh se mueve por las sombras de los que sostienen el cielo y exige alimento: corazón y sangre. Sin ofrendas, se detiene en el cielo y el mundo muere de frío. Cada altar que construyes es un pacto con su hambre.', when:()=> S.altars >= 5 },
  { id:'tlaloc', nm:'Tláloc, el que hace llover', tx:'Señor del paraíso de Tlalocan, donde nunca falta el maíz. Su máscara es de turquesa, sus dientes son colmillos. Recibe a los ahogados y a los que mueren por el rayo. Ríe y llueve; se enoja y graniza. Por eso tus milpas le pertenecen.', when:()=> S.milpas >= 3 },
  { id:'chicomecoatl', nm:'Chicomecóatl, la del maíz', tx:'Siete serpiente, la diosa del sustento. Cada año se elegía a una joven que la encarnaba; al final de la cosecha, su sangre volvía a la tierra para que el maíz volviera a nacer. Nada se da gratis: hasta el elote se paga.', when:()=> S.maiz >= 200 },
  { id:'quetzalcoatl', nm:'Quetzalcóatl, la serpiente emplumada', tx:'El viento y la sabiduría en un solo cuerpo. Robó los huesos de Mictlán y con su propia sangre les dio vida a los hombres. Dijo: "No son dioses los que exigen sangre, sino los que la dan". Enseñó las artes, el calendario y el juego. Enseñó a contar historias. Esta es una.', when:()=> S.casas >= 1 },
  { id:'tezcatlipoca', nm:'Tezcatlipoca, el espejo humeante', tx:'Su espejo de obsidiana ve los corazones. Dios de la noche y de la discordia, tienta a los soberbios y derriba a los poderosos. Nadie sabe de qué lado está. Quizá por eso los rituales riesgosos... le gustan.', when:()=> S.rituals.length >= 1 },
  { id:'mictlan', nm:'Mictlán, la casa de los nueve pisos', tx:'El inframundo donde todo mortal camina cuatro años por ríos, montañas de obsidiana y viento de navajas. Los que mueren de muerte dulce no van: van al Tlalocan o al jardín del sol. Pero los muertos comunes sí. Tu dios puede bajar y volver. Nadie más lo hace.', when:()=> S.templos >= 1 },
  { id:'xolotl', nm:'Xólotl, el gemelo', tx:'Perro gigante, guía de las almas, gemelo de Quetzalcóatl, el sol que se niega a moverse. Cuando algo termina, Xólotl es el que acompaña. Toda era que cae lleva su rastro de huellas de perro.', when:()=> S.eras >= 1 },
  { id:'mi_dios', nm:'La leyenda de tu dios', tx:'Aquí se escribirá tu leyenda cuando cierres tu primera era. El Quinto Sol se apagará. Lo que importa es qué dirán de ti los templos en ruinas.', when:()=> S.leyenda >= 1 }
];

// ---------- utilidades ----------
function fmt(n) {
  if (n < 1000) return Math.floor(n).toString();
  if (n < 1e6) return (n/1e3).toFixed(1) + 'K';
  if (n < 1e9) return (n/1e6).toFixed(2) + 'M';
  return (n/1e9).toFixed(2) + 'B';
}
let toastT = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(() => t.style.display = 'none', 4200);
}

// ---------- guardar ----------
function save() { S.lastSeen = Date.now(); try { localStorage.setItem('teotl_save', JSON.stringify(S)); } catch(e) {} }

// ---------- offline ----------
(function offline() {
  const dt = Math.min((Date.now() - (S.lastSeen || Date.now()))/1000, 8*3600);
  if (dt > 60) {
    const r = rates(), f = dt * .6;
    S.fe += r.fe*f; S.maiz += r.maiz*f; S.conoc += r.conoc*f; S.teotle += r.teotle*f;
    S.totalFe += r.fe*f; S.totalTeotle += r.teotle*f;
    setTimeout(() => toast('Mientras estabas ausente (' + (dt/3600).toFixed(1) + ' h), tu civilización siguió de pie: +' + fmt(r.fe*f) + ' fe, +' + fmt(r.maiz*f) + ' maíz.'), 400);
  }
})();

// ---------- render builds ----------
function renderBuilds() {
  const box = $('builds');
  box.innerHTML = '';
  for (const b of BUILDS) {
    const d = document.createElement('div');
    d.className = 'bld';
    d.innerHTML = '<button id="b_' + b.k + '"></button>';
    box.appendChild(d);
  }
}
function updBuilds() {
  for (const b of BUILDS) {
    const el = $('b_' + b.k), c = bcost(b);
    el.innerHTML = '<span class="nm">' + b.nm + '</span> x' + S[b.k] + '<span class="ds">' + b.ds + ' <b>+' + b.amt + ' ' + ({fe:'fe',maiz:'maíz',conoc:'conoc',teotle:'teotle'})[b.out] + '/s</b></span><span class="c">Costo: ' + costStr(c) + '</span>';
    el.disabled = !canPay(c);
  }
}

// ---------- render rituales ----------
function renderRituals() {
  const box = $('rituals');
  box.innerHTML = '';
  for (const r of RITS) {
    const d = document.createElement('div');
    d.className = 'rit' + (r.risk ? ' risk' : '');
    const done = S.rituals.includes(r.id);
    const avail = r.ok();
    d.innerHTML = '<div class="nm">' + r.nm + '</div><span class="ds">' + (done ? '<i>✓ Consumado — su efecto ya vive en tu era.</i>' : r.ds + (avail ? '' : '<br><i>Se revelará conforme crezca tu culto.</i>')) + '</span>' +
      (done ? '' : '<button id="r_' + r.id + '">EJECUTAR (' + costStr(r.cost()) + ')</button>');
    box.appendChild(d);
    if (!done) {
      const btn = $('r_' + r.id);
      if (!avail) { btn.textContent = '…'; btn.disabled = true; }
      else btn.disabled = !canPay(r.cost());
    }
  }
}
$('rituals').addEventListener('click', e => {
  if (e.target.id.startsWith('r_')) {
    const r = RITS.find(x => x.id === e.target.id.slice(2));
    if (r && !S.rituals.includes(r.id) && r.ok() && canPay(r.cost())) {
      pay(r.cost()); S.rituals.push(r.id); r.run(); renderRituals(); updCodex();
    }
  }
});

// ---------- render codex ----------
let codexDirty = true;
function updCodex() {
  for (const e of CODEX) if (!S.codex.includes(e.id) && e.when()) { S.codex.push(e.id); codexDirty = true; }
  if (!codexDirty) return;
  codexDirty = false;
  const box = $('codex');
  box.innerHTML = '';
  for (const e of CODEX) {
    const has = S.codex.includes(e.id);
    const d = document.createElement('div');
    d.className = 'ent' + (has ? '' : ' locked');
    let tx = has ? e.tx : 'Entrada sellada. Se abrirá con el progreso de tu culto.';
    if (e.id === 'mi_dios' && has) {
      tx = 'Dicen los que sobrevivieron: "Su culto reunió ' + fmt(Math.max(S.totalFe, S.totalFe)) + ' de fe en la era ' + S.eras + '. Ofrendó ' + S.rituals.length + ' rituales y cerró el sol con ' + S.leyenda + ' de leyenda." Los templos en ruinas aún susurran tu nombre.';
    }
    d.innerHTML = '<div class="nm">' + (has ? e.nm : '???') + '</div><span class="tx">' + tx + '</span>';
    box.appendChild(d);
  }
  $('codexCnt').textContent = S.codex.length + '/' + CODEX.length;
}

// ---------- cerrar era ----------
function checkFall() {
  const ready = S.totalTeotle >= ERA_GOAL;
  $('fallBtn').disabled = !ready;
  const pct = Math.min(100, S.totalTeotle / ERA_GOAL * 100);
  $('eraBar').style.width = pct + '%';
  $('eraTxt').textContent = ready
    ? 'El sol tiembla. Teotle acumulado: ' + fmt(S.totalTeotle) + ' / ' + ERA_GOAL + '. Puedes cerrar la era.'
    : 'Teotle acumulado: ' + fmt(S.totalTeotle) + ' / ' + ERA_GOAL + ' — el sol requiere esencia para sostenerse.';
}
$('fallBtn').onclick = () => {
  if (S.totalTeotle < ERA_GOAL) return;
  const gain = Math.max(1, Math.floor(Math.sqrt(S.totalFe / 400)));
  S.leyenda += gain; S.eras++;
  $('fallTxt').innerHTML = 'El Quinto Sol se apaga entre ceniza.<br><br>Tu dios se convierte en <b style="color:#e8c46a">+' + gain + ' leyenda</b> (total: ' + S.leyenda + '). Cada punto de leyenda otorga +15% de producción en las eras futuras. El mundo que dejaste queda en ruinas… y en historia. El Codex recuerda todo.';
  $('fall').style.display = 'flex';
  S.codex.push('xolotl'); if (!S.codex.includes('mi_dios')) S.codex.push('mi_dios');
  codexDirty = true;
  $('fallGo').onclick = () => {
    $('fall').style.display = 'none';
    const keep = { rituals: S.rituals, codex: S.codex, leyenda: S.leyenda, eras: S.eras, clicks: S.clicks, born: S.born };
    S = newRun(keep);
    renderBuilds(); renderRituals(); codexDirty = true; updCodex(); save();
    toast('Amanece el Quinto Sol de nuevo. Las eras pasan; la leyenda queda.');
  };
};

// ---------- orar ----------
$('pray').onclick = e => {
  const g = 2 * S.feMult * (1 + S.leyenda * .15);
  S.fe += g; S.totalFe += g; S.clicks++;
  const f = document.createElement('div');
  f.className = 'fly'; f.textContent = '+' + fmt(g);
  f.style.left = (e.clientX - 10) + 'px'; f.style.top = (e.clientY - 10) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1000);
};

// ---------- loop ----------
let last = Date.now(), acc = 0, saveAcc = 0;
function tick() {
  const now = Date.now(), dt = Math.min((now - last)/1000, 5); last = now;
  const r = rates();
  S.fe += r.fe*dt; S.maiz += r.maiz*dt; S.conoc += r.conoc*dt; S.teotle += r.teotle*dt;
  S.totalFe += r.fe*dt; S.totalTeotle += r.teotle*dt;
  saveAcc += dt;
  // render
  $('fe').textContent = fmt(S.fe); $('maiz').textContent = fmt(S.maiz);
  $('conoc').textContent = fmt(S.conoc); $('teotle').textContent = fmt(S.teotle);
  $('feRate').textContent = '+' + fmt(r.fe) + '/s'; $('maizRate').textContent = '+' + fmt(r.maiz) + '/s';
  $('conocRate').textContent = '+' + fmt(r.conoc) + '/s'; $('teotleRate').textContent = '+' + fmt(r.teotle) + '/s';
  $('leyendaTxt').textContent = S.leyenda > 0 ? '★ leyenda: ' + S.leyenda : '';
  updBuilds(); checkFall(); updCodex();
  if (saveAcc > 5) { saveAcc = 0; save(); renderRituals(); }
}
renderBuilds(); renderRituals(); updCodex(); checkFall();
setInterval(tick, 100);
addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
</script>
